name = "flo-aide"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = "src/cloudflare-worker.ts"

[triggers]
crons = ["0 18 * * *", "0 16 * * *"]

# 정기결제 자동 갱신 — 구독 1건당 인스턴스 1개 (src/workflows/billingRenew.ts)
[[workflows]]
name = "flo-aide-billing-renew"
binding = "BILLING_RENEW"
class_name = "BillingRenewWorkflow"

[vars]
NEXT_PUBLIC_SUPABASE_URL = "https://ziqatrvwyfvoscfmaaoi.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_di62Rtm8LjKeDaOYZpXolQ_kiOrKf8K"
NEXT_PUBLIC_TOSS_CLIENT_KEY = "live_ck_Z61JOxRQVEazAlExQX5aVW0X9bAq"
NEXT_PUBLIC_TOSS_BILLING_CLIENT_KEY = "live_ck_DnyRpQWGrNWmXo1O020L8Kwv1M9E"
